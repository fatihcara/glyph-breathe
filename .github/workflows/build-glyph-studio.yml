name: Build Glyph Studio Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GlyphStudio-NothingPhone1-source.tar.xz'
      - '.github/workflows/build-glyph-studio.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify and extract source archive
        run: |
          echo 'a415bd9e466885487d204a2f9368ed27600dc5ed0ac41cf37a41da34a58c975e  GlyphStudio-NothingPhone1-source.tar.xz' | sha256sum --check
          tar -xJf GlyphStudio-NothingPhone1-source.tar.xz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Load stable debug signing key if configured
        env:
          GLYPH_DEBUG_KEYSTORE_BASE64: ${{ secrets.GLYPH_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GLYPH_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$GLYPH_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Stable debug signing key loaded."
          else
            echo "No stable signing key configured; using this runner's temporary debug key."
          fi

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: GlyphStudio
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK package and signature
        working-directory: GlyphStudio
        shell: bash
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.spacegoat.glyphstudio'"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlyphStudio-debug-apk
          path: GlyphStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
